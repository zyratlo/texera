# Local dev metadata Postgres for Texera (created during local setup).
# Runs Postgres 15 with the PGroonga full-text-search extension preinstalled,
# published on localhost:5432 so backend services (run in IntelliJ) can reach it.
#
# The two SQL files are mounted into /docker-entrypoint-initdb.d and run ONCE,
# on first boot with an empty data volume, via psql. They create:
#   - texera_db               (metadata / user system)   -> storage.conf `jdbc`
#   - texera_iceberg_catalog  (Iceberg catalog)           -> storage.conf `iceberg.catalog.postgres`
# and the `texera` role, and enable the pgroonga extension.
#
# Credentials (postgres/postgres) match the defaults in
# common/config/src/main/resources/storage.conf.
#
# Usage:
#   docker compose -f sql/docker-compose.dev-metadata.yml up -d      # start
#   docker compose -f sql/docker-compose.dev-metadata.yml logs -f    # watch init
#   docker compose -f sql/docker-compose.dev-metadata.yml down       # stop (keeps data)
#   docker compose -f sql/docker-compose.dev-metadata.yml down -v    # stop + wipe data (re-runs init next boot)

name: texera-db
services:
  postgres:
    image: groonga/pgroonga:4.0.1-debian-15
    container_name: texera-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # POSTGRES_DB defaults to POSTGRES_USER (postgres); the init scripts
      # create texera_db and texera_iceberg_catalog themselves.
    ports:
      - "5432:5432"
    volumes:
      - texera-db-data:/var/lib/postgresql/data
      # Init scripts (run alphabetically, once, on empty volume):
      - ./iceberg_postgres_catalog.sql:/docker-entrypoint-initdb.d/01_iceberg_postgres_catalog.sql:ro
      - ./texera_ddl.sql:/docker-entrypoint-initdb.d/02_texera_ddl.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "texera_db"]
      interval: 10s
      retries: 5
      start_period: 10s

volumes:
  texera-db-data:
